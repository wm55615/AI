<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Puzzle</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

<div class="card">
  <div class="header">
    <button id="loc-btn">Moja lokalizacja</button>
    <button id="perm-btn">Pobierz zgody</button>
    <button id="zoom-in">+</button>
    <button id="zoom-out">-</button>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div id="cleanMap"></div>
  </div>
</div>

<div class="card">
    <div class="header">
      <button id="export-btn">Pobierz mapę</button>
      <div class="small">Podgląd</div>
    </div>
  
    <div id="snapshot-wrap" style="flex:1; display:flex; justify-content:center; align-items:center; background:#eee;">
        <div id="placeholder" style="color:#777; font-size:18px;">Brak mapy</div>
        <img id="snapshot" src="" style="display:none; width:100%; height:100%; object-fit:cover;">
    </div>
  </div>

<div class="card">
  <div class="header"><div class="small">Puzzle</div></div>
  <div id="pieces-area"></div>
</div>

<div class="card">
  <div class="header"><div class="small">Układanie puzzli</div></div>
  <div class="board" id="board"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
